<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2 CSS</title>
</head>
<body>

    <h1>Exercise 2</h1>
    <div class="box1">This is a div box.</div>
    <div class="box2">This is another div box.</div>

    
</body>

<style>
    /* 页面整体设置 */
    body {
    font-family: Arial, sans-serif;
    margin: 40px;
    }

    /* 标题样式 - "Exercise 2" */
    h1 {
    color: blue;
    font-size: 36px;
    font-weight: bold;
    border: 2px dashed green;
    display: inline-block; /* 让边框紧贴文字 */
    padding: 5px 10px;
    margin-bottom: 30px;
    }

    /* 第一个蓝色盒子 */
    .box1 {
    background-color: lightblue;
    border: 2px solid blue;
    padding: 10px;
    width: fit-content; /* 或指定固定宽度如 250px */
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: bold;
    color: black;
    }

    /* 第二个蓝色盒子 - 红色斜体文字 */
    .box2 {
    background-color: lightblue;
    border: 2px solid red;
    padding: 10px;
    width: fit-content;
    font-size: 18px;
    font-style: italic;
    color: red;
    }
</style>
</html>
