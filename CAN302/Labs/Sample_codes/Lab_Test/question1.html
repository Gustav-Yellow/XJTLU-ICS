<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

    <script>
        function treePrint (height) {
            // add your code here
            let tree = '';
            
            for (let i=0; i<height; i++) {
                let line = '';

                for (let j=0; j<height-i; j++) {
                    line += '~';
                }

                for (let j=0; j<2*i+1; j++) {
                    line += '*';
                }

                for (let j=0; j<height-i; j++) {
                    line += '~';
                }
                line += '\n';
                tree += line;
            }
            console.log(tree);
            
        }
    </script>
    
</body>
</html>
