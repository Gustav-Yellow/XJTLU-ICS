<!DOCTYPE html>
<html>
	<head>
		<title>Table Example</title>
	</head>

	<body>
		<table width="200" height="200" border="2" bgcolor="yellow">
        	<tr>
            	<td colspan="2">1</td>
            	<td>3</td>
        	</tr>
        	<tr>
            	<td rowspan="2">4</td>
            	<td>5</td>
            	<td>6</td>
        	</tr>
        	<tr bgcolor="red">
            	<td>8</td>
            	<td>9</td>
        	</tr>
    	</table>
	</body>
</html>
