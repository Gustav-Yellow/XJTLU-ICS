<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap Grid2</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container text-center">
            <div class="row">
                <div class="col-12 col-sm-6 col-lg-3" style="border: solid 1px orange;">1</div>
                <div class="col-12 col-sm-6 col-lg-3" style="border: solid 1px red;">2</div>
                <div class="col-12 col-sm-6 col-lg-3" style="border: solid 1px green;">3</div>
                <div class="col-12 col-sm-6 col-lg-3" style="border: solid 1px blue;">4</div>
            </div>
        </div>
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
